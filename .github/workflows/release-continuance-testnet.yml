name: release-continuance-testnet
on:
  push:
    tags:
      - "v1.26.0-community-continuance"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout binary assets
        uses: actions/checkout@v4
        with:
          ref: release-assets/v1.26.0-community-continuance
          fetch-depth: 1

      - name: Create Release with notes and packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.26.0-community-continuance
          name: v1.26.0-community-continuance
          files: |
            secretnetwork_1.26.0_TESTNET_goleveldb_amd64_ubuntu-22.04.deb
            secretnetwork_1.26.0_TESTNET_goleveldb_amd64_ubuntu-24.04.deb
          body: |
            ## Install

            ```bash
            curl -fsSL -o install.sh \
              https://raw.githubusercontent.com/Secret3dev/SecretNetwork/v1.26.0-community-continuance/scripts/install-continuance-testnet.sh
            chmod +x install.sh
            sudo ./install.sh
            ```

            Detects Ubuntu **22.04** or **24.04**, downloads the matching package from this Release, verifies sha256, restarts `secret-node`.

            Do **not** use `--unsafe-skip-upgrades`.

            ## Packages

            | File | SHA-256 |
            |------|---------|
            | `secretnetwork_1.26.0_TESTNET_goleveldb_amd64_ubuntu-22.04.deb` | `672dd49b5b95587559e998f89e260142a4bcdb958a5f3009ece50e8ff4ce06d4` |
            | `secretnetwork_1.26.0_TESTNET_goleveldb_amd64_ubuntu-24.04.deb` | `d86def55a3c38c7de3dd91583bc66c29e05962e039e0b2ae47939b5f04faf925` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
